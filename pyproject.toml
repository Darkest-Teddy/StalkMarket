[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "farm-finance-api"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "fredapi>=0.5.0",
]

[project.scripts]
app = "main:app"

[tool.setuptools]
py-modules = ["main"]
packages = []
include-package-data = false
