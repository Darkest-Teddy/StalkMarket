[tool.poetry]
name = "stalk-market"
version = "0.1.0"
description = "Stalk Market FastAPI backend"
authors = ["Stalk Market Team <dev@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = "^0.38.0"
numpy = "^2.0.0"
pandas = "^2.2.0"
pydantic = "^2.6.0"
statsmodels = "^0.14.0"
fredapi = "^0.5.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
