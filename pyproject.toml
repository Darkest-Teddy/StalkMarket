[project]
name = "stalk-market"
version = "0.1.0"
description = "Stalk Market FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "numpy",
    "pandas",
    "pydantic",
    "statsmodels",
    "fredapi",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
